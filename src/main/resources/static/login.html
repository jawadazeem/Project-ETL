<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | Blueprint</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="icon" href="/assets/icons/favicon.png" />
    <link rel="stylesheet" href="/css/main.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body class="login-page">
<div class="login-shell">
    <div class="brand-panel">
        <div class="brand-title">Blueprint</div>
        <div class="brand-sub">Telecom billing analytics and insights dashboard.</div>
    </div>

    <div class="login-panel">
        <div class="login-header">
            <h2>Start with Blueprint</h2>
            <p>Continue as a guest for the fastest demo, or create a local demo account.</p>
        </div>

        <button id="guestBtn" class="guest-btn" type="button">
            Continue as Guest
        </button>

        <div class="auth-separator">
            <span></span>
            <small>Local demo account</small>
            <span></span>
        </div>

        <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
            <button id="signInTab" class="auth-tab active" type="button">Sign In</button>
            <button id="signUpTab" class="auth-tab" type="button">Sign Up</button>
        </div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" />
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" />
            </div>

            <div id="confirmPasswordGroup" class="mb-3 hidden">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" />
            </div>

            <div class="helper-row">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>

                <button id="clearLocalAccount" class="helper-link" type="button">Clear local account</button>
            </div>

            <button id="submitAuthBtn" type="submit" class="btn btn-primary login-btn">
                Sign In
            </button>
        </form>

        <div id="statusMessage" class="status-message"></div>

        <div class="footer">
            Local demo accounts are stored only in this browser.
        </div>
    </div>
</div>

<script src="/js/main.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
