# Configuration applied to all profiles (default)
spring:
  application:
    name: blueprint
  cloud:
    aws:
      s3:
        endpoint: ${AWS_S3_ENDPOINT:http://billing-s3-mock:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://billing-s3-mock:4566}
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY:test}
        secret-key: ${AWS_SECRET_KEY:test}
  ai:
    model:
      chat: ${BLUEPRINT_AI_PROVIDER:google-genai}
      embedding: ${BLUEPRINT_AI_PROVIDER:google-genai}
      embedding.text: ${BLUEPRINT_AI_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY}
        project-id: ${GOOGLE_PROJECT_ID}
        location: "us-central1"
        credentials:
          api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: "gemini-2.5-flash"
            temperature: 0.1
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY}
          project-id: ${GOOGLE_PROJECT_ID}
          location: "us-central1"
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    ollama:
      base-url: "http://host.docker.internal:11434"
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2}
      embedding:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: "WHEN_MISSING"
    vectorstore:
      pgvector:
        initialize-schema: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
server:
  port: 8080
  error:
    whitelabel:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: Blueprint
    description: Multi-Cloud FinOps & Cost Management Platform
    version: 1.0.0
logging:
  file:
    name: app.log
# Business-specific configuration
billing:
  charges:
    max-top-n: 100
alarm:
  provider:
    monthlyLimit: 25000
  individual:
    low: 1000
    medium: 2000
    high: 5000
  account:
    low: 500000
    high: 750000
billing-reader:
  has-header: true
  batch-size: 1000
trace-knowledge:
  folder-path: /trace-knowledge
  bucket-name: trace-knowledge
  keys:
    - audit.md
    - cost-optimization-recommendations.md
    - executive-summary.md
    - policy-and-contract-fit.md
    - explain-spend-increase.md
    - general.md
org-context:
  bucket-name: cloud-billing
  max-files: 5
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:3001}
  recipients:
    email: ${NOTIFICATION_RECIPIENTS_EMAIL:}
prediction:
  service:
    url: ${PREDICTION_SERVICE_URL:http://prediction-service:5000}
audit:
  service:
    url: ${AUDIT_SERVICE_URL:http://audit-service:5001}
cloud-connection:
  encryption-key: ${CLOUD_CONNECTION_ENCRYPTION_KEY:dGVzdC1rZXktMzItYnl0ZXMtbG9uZy1mb3ItYWVzMjU=}

# Database config
database-config:
  vector-db:
    url: ${VECTOR_DB_URL:jdbc:postgresql://pgvector:5432/blueprint_org-context}
    username: ${VECTOR_DB_USERNAME:blueprint}
    password: ${VECTOR_DB_PASSWORD:${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}}

---
# Configuration for the 'dev' profile only
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/billingdb}
    username: ${SPRING_DATASOURCE_USERNAME:billing_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          jdbc:
            batch_size: 500
          order_inserts: true
          order_updates: true
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
---
# Configuration for the 'test' profile only
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

---
# Configuration for the 'prod' profile only
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
