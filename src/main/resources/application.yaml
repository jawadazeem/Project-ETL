# Configuration applied to all profiles (default)
spring:
  application:
    name: blueprint
  cloud:
    aws:
      s3:
        endpoint: ${AWS_S3_ENDPOINT:http://billing-s3-mock:4566}
        path-style-access-enabled: true
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://billing-s3-mock:4566}
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY:test}
        secret-key: ${AWS_SECRET_KEY:test}
  ai:
    google:
      genai:
        project-id: ${GOOGLE_PROJECT_ID}
        location: "us-central1"
        credentials:
          api-key: ${GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: "gemini-2.5-flash"
            temperature: 0.1
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
server:
  port: 8080
  error:
    whitelabel:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: Blueprint
    description: Multi-Cloud FinOps & Cost Management Platform
    version: 1.0.0
logging:
  file:
    name: app.log
# Business-specific configuration
billing:
  charges:
    max-top-n: 100
alarm:
  provider:
    monthlyLimit: 25000
  individual:
    low: 500
    medium: 2000
    high: 5000
  account:
    low: 100000
    high: 250000
billing-reader:
  has-header: true
  batch-size: 1000
notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:3001}
  recipients:
    email: ${NOTIFICATION_RECIPIENTS_EMAIL:}
prediction:
  service:
    url: ${PREDICTION_SERVICE_URL:http://prediction-service:5000}

---
# Configuration for the 'dev' profile only
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      initialization-fail-timeout: 0
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
---
# Configuration for the 'test' profile only
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop

---
# Configuration for the 'prod' profile only
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
