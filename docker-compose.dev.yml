services:
  postgres:
    image: postgres:16
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: billing_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_app -d billingdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:3.0.0
    container_name: billing-s3-mock
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - "./localstack_data:/var/lib/localstack"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build: .
    container_name: billing-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      aws-cli-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/billingdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - AWS_S3_ENDPOINT=http://localstack:4566
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY=test
      - AWS_SECRET_KEY=test
      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
      - SPRING_AI_GOOGLE_GENAI_PROJECT_ID=${GOOGLE_PROJECT_ID}

  aws-cli-setup:
    image: amazon/aws-cli
    container_name: infra-setup
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      echo 'Waiting for Localstack S3...';
      until aws --endpoint-url=http://billing-s3-mock:4566 s3 ls > /dev/null 2>&1; do
        sleep 2;
      done;

      echo 'Waiting for SQS...';
      until aws --endpoint-url=http://billing-s3-mock:4566 sqs list-queues > /dev/null 2>&1; do
        sleep 2;
      done;
      
      echo 'Configuring SQS Queues...';
      aws --endpoint-url=http://billing-s3-mock:4566 sqs create-queue --queue-name billing-event-queue;
      aws --endpoint-url=http://billing-s3-mock:4566 sqs create-queue --queue-name knowledge-event-queue;
      
      echo 'Configuring S3 Buckets...';
      aws --endpoint-url=http://billing-s3-mock:4566 s3 mb s3://cloud-billing;
      aws --endpoint-url=http://billing-s3-mock:4566 s3 mb s3://martin-knowledge;
      
      echo 'Linking S3 to SQS...';
      # Link Billing
      aws --endpoint-url=http://billing-s3-mock:4566 s3api put-bucket-notification-configuration --bucket cloud-billing --notification-configuration '{\"QueueConfigurations\":[{\"QueueArn\":\"arn:aws:sqs:us-east-1:000000000000:billing-event-queue\",\"Events\":[\"s3:ObjectCreated:*\"]}]}';
      
      # Link Knowledge
      aws --endpoint-url=http://billing-s3-mock:4566 s3api put-bucket-notification-configuration --bucket martin-knowledge --notification-configuration '{\"QueueConfigurations\":[{\"QueueArn\":\"arn:aws:sqs:us-east-1:000000000000:knowledge-event-queue\",\"Events\":[\"s3:ObjectCreated:*\"]}]}';
      
      echo 'Infrastructure configuration complete.'
      "

  prediction-service:
    build: ./prediction-service
    container_name: prediction-service
    restart: always

volumes:
  postgres_data: