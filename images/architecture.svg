<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 960" width="1600" height="960"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>

    <!-- Backgrounds -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#0C1728"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#131F35"/>
      <stop offset="100%" stop-color="#0D1829"/>
    </linearGradient>
    <linearGradient id="ecsCard" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#152A17"/>
      <stop offset="100%" stop-color="#0D1E0F"/>
    </linearGradient>

    <!-- Dot grid -->
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>

    <!-- Arrow markers -->
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#FF9900"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4FC3F7"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#81C784"/>
    </marker>
    <marker id="arr-pink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#F48FB1"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#CE93D8"/>
    </marker>

    <!-- Filters -->
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="ecsGlow" x="-8%" y="-5%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#6DB33F" flood-opacity="0.18" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── BACKGROUND ─────────────────────────────────────────────── -->
  <rect width="1600" height="960" fill="url(#bg)"/>
  <rect width="1600" height="960" fill="url(#dots)"/>

  <!-- Faint column separators -->
  <line x1="346" y1="88" x2="346" y2="860" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.06"/>
  <line x1="706" y1="88" x2="706" y2="860" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.06"/>
  <line x1="1060" y1="88" x2="1060" y2="860" stroke="#FFFFFF" stroke-width="0.4" stroke-opacity="0.06"/>

  <!-- ── TITLE ────────────────────────────────────────────────────── -->
  <text x="800" y="44" text-anchor="middle" font-size="23" font-weight="700"
        fill="#F0F4FF" letter-spacing="0.4">Telecom Billing Intelligence Platform — Architecture</text>
  <text x="800" y="66" text-anchor="middle" font-size="11.5" fill="#4A637D" letter-spacing="0.4">
    Blueprint · AWS Cloud · Spring Boot 3 · TypeScript Microservices · SIEM
  </text>
  <line x1="360" y1="76" x2="1240" y2="76" stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.12"/>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  ARROWS  (drawn before cards so cards sit on top)            -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- S3 → SQS (vertical) -->
  <line x1="187" y1="248" x2="187" y2="297"
        stroke="#FF9900" stroke-width="1.8" marker-end="url(#arr-orange)"/>

  <!-- SQS → ECS (curved right) -->
  <path d="M316,368 C348,368 356,356 372,356"
        stroke="#FF9900" stroke-width="1.8" fill="none" marker-end="url(#arr-orange)"/>

  <!-- ECS → RDS (diagonal up-right) -->
  <line x1="676" y1="218" x2="757" y2="176"
        stroke="#4FC3F7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ECS → TypeScript Notification (horizontal) -->
  <line x1="676" y1="401" x2="757" y2="401"
        stroke="#4FC3F7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- TypeScript → Delivery (horizontal) -->
  <line x1="1011" y1="401" x2="1072" y2="401"
        stroke="#4FC3F7" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- ECS → CloudWatch (slightly angled down) -->
  <line x1="520" y1="572" x2="500" y2="632"
        stroke="#81C784" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- CloudWatch → SNS (horizontal) -->
  <line x1="626" y1="713" x2="682" y2="713"
        stroke="#F48FB1" stroke-width="1.8" marker-end="url(#arr-pink)"/>

  <!-- CloudWatch → SIEM (dashed, horizontal) -->
  <line x1="626" y1="737" x2="970" y2="737"
        stroke="#CE93D8" stroke-width="1.8" stroke-dasharray="6,3"
        marker-end="url(#arr-purple)"/>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  ARROW LABELS                                                 -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <rect x="150" y="259" width="74" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="187" y="271" text-anchor="middle" font-size="9" fill="#FF9900">S3 Event</text>

  <rect x="302" y="337" width="90" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="347" y="349" text-anchor="middle" font-size="9" fill="#FF9900">@SqsListener</text>

  <rect x="678" y="183" width="76" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="716" y="195" text-anchor="middle" font-size="9" fill="#4FC3F7">JPA / Liquibase</text>

  <rect x="678" y="384" width="68" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="712" y="396" text-anchor="middle" font-size="9" fill="#4FC3F7">POST /notify</text>

  <rect x="1012" y="384" width="48" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="1036" y="396" text-anchor="middle" font-size="9" fill="#4FC3F7">Deliver</text>

  <rect x="460" y="592" width="88" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="504" y="604" text-anchor="middle" font-size="9" fill="#81C784">Logs &amp; Metrics</text>

  <rect x="626" y="695" width="60" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="656" y="707" text-anchor="middle" font-size="9" fill="#F48FB1">CW Alarm</text>

  <rect x="724" y="720" width="76" height="17" rx="3" fill="#080F1E" fill-opacity="0.85"/>
  <text x="762" y="732" text-anchor="middle" font-size="9" font-style="italic" fill="#CE93D8">Log Export</text>


  <!-- ══════════════════════════════════════════════════════════════ -->
  <!--  CARDS                                                        -->
  <!-- ══════════════════════════════════════════════════════════════ -->

  <!-- ── S3 Bucket ────────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="62" y="100" width="252" height="143" rx="10"
          fill="url(#card)" stroke="#FF9900" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="62" y="100" width="5" height="143" rx="2.5" fill="#FF9900"/>
    <text x="82" y="125" font-size="9"   fill="#FF9900" font-weight="600" letter-spacing="1.2">AWS S3</text>
    <text x="82" y="148" font-size="14.5" fill="#F5F5F5" font-weight="700">S3 Bucket</text>
    <text x="82" y="166" font-size="10"  fill="#607D8B">telecom-billing-ingest-bucket</text>
    <line x1="82" y1="177" x2="304" y2="177" stroke="#FF9900" stroke-width="0.4" stroke-opacity="0.25"/>
    <text x="82" y="194" font-size="10.5" fill="#90A4AE">Billing company uploads CSV via</text>
    <text x="82" y="211" font-size="10.5" fill="#90A4AE">pre-signed URL — no creds needed</text>
    <text x="82" y="233" font-size="8.5" fill="#FF9900" opacity="0.6">aws.amazon.com/s3</text>
  </g>

  <!-- ── SQS Queue ─────────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="62" y="300" width="252" height="143" rx="10"
          fill="url(#card)" stroke="#FF9900" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="62" y="300" width="5" height="143" rx="2.5" fill="#FF9900"/>
    <text x="82" y="325" font-size="9"   fill="#FF9900" font-weight="600" letter-spacing="1.2">AWS SQS</text>
    <text x="82" y="348" font-size="14.5" fill="#F5F5F5" font-weight="700">SQS Queue</text>
    <text x="82" y="366" font-size="10"  fill="#607D8B">Task Buffer / Message Queue</text>
    <line x1="82" y1="377" x2="304" y2="377" stroke="#FF9900" stroke-width="0.4" stroke-opacity="0.25"/>
    <text x="82" y="394" font-size="10.5" fill="#90A4AE">S3 triggers message containing</text>
    <text x="82" y="411" font-size="10.5" fill="#90A4AE">S3 object key for the new file</text>
    <text x="82" y="433" font-size="8.5" fill="#FF9900" opacity="0.6">aws.amazon.com/sqs</text>
  </g>

  <!-- ── ECS / Spring Boot (highlighted main card) ────────────── -->
  <g filter="url(#ecsGlow)">
    <rect x="372" y="152" width="304" height="420" rx="10"
          fill="url(#ecsCard)" stroke="#6DB33F" stroke-width="1.6" stroke-opacity="0.65"/>
    <!-- outer soft glow ring -->
    <rect x="372" y="152" width="304" height="420" rx="10"
          fill="none" stroke="#6DB33F" stroke-width="8" stroke-opacity="0.07"/>
    <rect x="372" y="152" width="5" height="420" rx="2.5" fill="#6DB33F"/>

    <text x="393" y="179" font-size="9" fill="#6DB33F" font-weight="600" letter-spacing="1.1">AWS FARGATE ECS · SERVERLESS COMPUTE</text>
    <text x="393" y="203" font-size="15.5" fill="#F5F5F5" font-weight="700">Spring Boot Application</text>
    <text x="393" y="221" font-size="10.5" fill="#81C784">Java 21 · Spring Boot 3 · JPA · Liquibase</text>
    <line x1="393" y1="234" x2="662" y2="234" stroke="#6DB33F" stroke-width="0.4" stroke-opacity="0.35"/>

    <text x="393" y="256" font-size="9" fill="#4CAF50" font-weight="600" letter-spacing="0.8">INGESTION PIPELINE</text>
    <text x="393" y="275" font-size="10.5" fill="#B0BEC5">• @SqsListener consumes S3 key</text>
    <text x="393" y="293" font-size="10.5" fill="#B0BEC5">• Streams CSV directly via S3Client</text>
    <text x="393" y="311" font-size="10.5" fill="#B0BEC5">• ETL — Extract → Transform → Load</text>
    <text x="393" y="329" font-size="10.5" fill="#B0BEC5">• Persists BillingRecords to RDS</text>

    <line x1="393" y1="345" x2="662" y2="345" stroke="#6DB33F" stroke-width="0.4" stroke-opacity="0.35"/>
    <text x="393" y="366" font-size="9" fill="#4CAF50" font-weight="600" letter-spacing="0.8">ALARM DETECTION ENGINE</text>
    <text x="393" y="385" font-size="10.5" fill="#B0BEC5">• Dept / Individual / Account thresholds</text>
    <text x="393" y="403" font-size="10.5" fill="#B0BEC5">• Deduplication via deterministic key</text>
    <text x="393" y="421" font-size="10.5" fill="#B0BEC5">• Persists new alarms to RDS</text>
    <text x="393" y="439" font-size="10.5" fill="#B0BEC5">• POST /notify → Notification Service</text>

    <line x1="393" y1="455" x2="662" y2="455" stroke="#6DB33F" stroke-width="0.4" stroke-opacity="0.35"/>
    <text x="393" y="476" font-size="9" fill="#4CAF50" font-weight="600" letter-spacing="0.8">MARTIN — AI BILLING ANALYST</text>
    <text x="393" y="495" font-size="10.5" fill="#B0BEC5">• Natural language → SQL (Gemini 2.5 Flash)</text>
    <text x="393" y="513" font-size="10.5" fill="#B0BEC5">• Read-only validated query execution</text>
    <text x="393" y="531" font-size="10.5" fill="#B0BEC5">• Explainability layer over billing data</text>

    <line x1="393" y1="548" x2="662" y2="548" stroke="#6DB33F" stroke-width="0.4" stroke-opacity="0.35"/>
    <text x="393" y="563" font-size="8.5" fill="#6DB33F" opacity="0.6">spring.io · aws.amazon.com/fargate · Secrets Manager</text>
  </g>

  <!-- ── RDS PostgreSQL ─────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="757" y="100" width="252" height="158" rx="10"
          fill="url(#card)" stroke="#527FFF" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="757" y="100" width="5" height="158" rx="2.5" fill="#527FFF"/>
    <text x="777" y="125" font-size="9"   fill="#7986CB" font-weight="600" letter-spacing="1.2">AWS RDS</text>
    <text x="777" y="148" font-size="14.5" fill="#F5F5F5" font-weight="700">PostgreSQL Database</text>
    <text x="777" y="166" font-size="10"  fill="#607D8B">Managed Relational Database</text>
    <line x1="777" y1="177" x2="999" y2="177" stroke="#527FFF" stroke-width="0.4" stroke-opacity="0.25"/>
    <text x="777" y="194" font-size="10.5" fill="#90A4AE">Datasets · BillingRecords · Alarms</text>
    <text x="777" y="211" font-size="10.5" fill="#90A4AE">AppUsers · schema via Liquibase</text>
    <text x="777" y="231" font-size="10.5" fill="#90A4AE">Credentials → AWS Secrets Manager</text>
    <text x="777" y="249" font-size="8.5" fill="#7986CB" opacity="0.6">aws.amazon.com/rds</text>
  </g>

  <!-- ── TypeScript Notification Service ───────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="757" y="316" width="254" height="190" rx="10"
          fill="url(#card)" stroke="#3178C6" stroke-width="0.8" stroke-opacity="0.45"/>
    <rect x="757" y="316" width="5" height="190" rx="2.5" fill="#3178C6"/>
    <!-- TS badge pill -->
    <rect x="960" y="325" width="40" height="20" rx="5" fill="#3178C6"/>
    <text x="980" y="339" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">TS</text>

    <text x="777" y="342" font-size="9"   fill="#64B5F6" font-weight="600" letter-spacing="1.2">NODE.JS MICROSERVICE</text>
    <text x="777" y="365" font-size="14.5" fill="#F5F5F5" font-weight="700">Notification Service</text>
    <text x="777" y="383" font-size="10"  fill="#607D8B">Express · TypeScript · AWS SES</text>
    <line x1="777" y1="394" x2="1001" y2="394" stroke="#3178C6" stroke-width="0.4" stroke-opacity="0.3"/>
    <text x="777" y="411" font-size="10.5" fill="#90A4AE">• POST /notify — receives alarm payload</text>
    <text x="777" y="429" font-size="10.5" fill="#90A4AE">• Routes: Email (SES), Slack, SMS</text>
    <text x="777" y="447" font-size="10.5" fill="#90A4AE">• Notification history &amp; retry logic</text>
    <text x="777" y="465" font-size="10.5" fill="#90A4AE">• Typed contract: AlarmNotificationPayload</text>
    <text x="777" y="496" font-size="8.5" fill="#64B5F6" opacity="0.6">repo: blueprint-notifications</text>
  </g>

  <!-- ── Delivery Channels ─────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="1072" y="316" width="210" height="190" rx="10"
          fill="url(#card)" stroke="#26A69A" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="1072" y="316" width="5" height="190" rx="2.5" fill="#26A69A"/>
    <text x="1092" y="342" font-size="9"   fill="#4DB6AC" font-weight="600" letter-spacing="1.2">DELIVERY CHANNELS</text>
    <text x="1092" y="365" font-size="14.5" fill="#F5F5F5" font-weight="700">Notifications</text>
    <line x1="1092" y1="378" x2="1272" y2="378" stroke="#26A69A" stroke-width="0.4" stroke-opacity="0.3"/>
    <text x="1096" y="402" font-size="12.5" fill="#B0BEC5">📧  Email Alerts</text>
    <text x="1096" y="427" font-size="12.5" fill="#B0BEC5">💬  Slack Webhooks</text>
    <text x="1096" y="452" font-size="12.5" fill="#B0BEC5">📱  SMS (optional)</text>
    <text x="1092" y="476" font-size="10.5" fill="#90A4AE">Severity · scope · employee</text>
    <text x="1092" y="493" font-size="10.5" fill="#90A4AE">department · explanation</text>
  </g>

  <!-- ── CloudWatch ─────────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="374" y="632" width="252" height="168" rx="10"
          fill="url(#card)" stroke="#E7157B" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="374" y="632" width="5" height="168" rx="2.5" fill="#E7157B"/>
    <text x="394" y="658" font-size="9"   fill="#F48FB1" font-weight="600" letter-spacing="1.2">AWS CLOUDWATCH</text>
    <text x="394" y="681" font-size="14.5" fill="#F5F5F5" font-weight="700">Logs &amp; Metrics</text>
    <text x="394" y="699" font-size="10"  fill="#607D8B">Observability Platform</text>
    <line x1="394" y1="710" x2="616" y2="710" stroke="#E7157B" stroke-width="0.4" stroke-opacity="0.25"/>
    <text x="394" y="727" font-size="10.5" fill="#90A4AE">Real-time metrics &amp; dashboards</text>
    <text x="394" y="745" font-size="10.5" fill="#90A4AE">Log retention &amp; alarm triggers</text>
    <text x="394" y="763" font-size="10.5" fill="#90A4AE">Exports log streams → SIEM</text>
    <text x="394" y="790" font-size="8.5" fill="#F48FB1" opacity="0.6">aws.amazon.com/cloudwatch</text>
  </g>

  <!-- ── AWS SNS ─────────────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="682" y="632" width="232" height="168" rx="10"
          fill="url(#card)" stroke="#FF9900" stroke-width="0.8" stroke-opacity="0.35"/>
    <rect x="682" y="632" width="5" height="168" rx="2.5" fill="#FF9900"/>
    <text x="702" y="658" font-size="9"   fill="#FF9900" font-weight="600" letter-spacing="1.2">AWS SNS</text>
    <text x="702" y="681" font-size="14.5" fill="#F5F5F5" font-weight="700">Notifications</text>
    <text x="702" y="699" font-size="10"  fill="#607D8B">Infrastructure Alerting</text>
    <line x1="702" y1="710" x2="904" y2="710" stroke="#FF9900" stroke-width="0.4" stroke-opacity="0.25"/>
    <text x="702" y="727" font-size="10.5" fill="#90A4AE">CloudWatch alarm → email ops team</text>
    <text x="702" y="745" font-size="10.5" fill="#90A4AE">CPU / memory / error rate alerts</text>
    <text x="702" y="763" font-size="10.5" fill="#90A4AE">Infra-level alerting pipeline</text>
    <text x="702" y="790" font-size="8.5" fill="#FF9900" opacity="0.6">aws.amazon.com/sns</text>
  </g>

  <!-- ── SIEM ───────────────────────────────────────────────────── -->
  <g filter="url(#shadow)">
    <rect x="970" y="632" width="260" height="168" rx="10"
          fill="url(#card)" stroke="#7C3AED" stroke-width="0.8" stroke-opacity="0.45"/>
    <rect x="970" y="632" width="5" height="168" rx="2.5" fill="#7C3AED"/>
    <text x="990" y="658" font-size="9"   fill="#CE93D8" font-weight="600" letter-spacing="1.2">SECURITY · SIEM</text>
    <text x="990" y="681" font-size="14.5" fill="#F5F5F5" font-weight="700">Log Aggregation</text>
    <text x="990" y="699" font-size="10"  fill="#607D8B">Splunk · OpenSearch · Security Lake</text>
    <line x1="990" y1="710" x2="1220" y2="710" stroke="#7C3AED" stroke-width="0.4" stroke-opacity="0.3"/>
    <text x="990" y="727" font-size="10.5" fill="#90A4AE">Ingests structured CloudWatch logs</text>
    <text x="990" y="745" font-size="10.5" fill="#90A4AE">Threat detection &amp; correlation</text>
    <text x="990" y="763" font-size="10.5" fill="#90A4AE">Audit trail · compliance reports</text>
    <text x="990" y="790" font-size="8.5" fill="#CE93D8" opacity="0.6">via CW Subscription / Kinesis Firehose</text>
  </g>


  <!-- ── FOOTER ────────────────────────────────────────────────── -->
  <line x1="200" y1="868" x2="1400" y2="868"
        stroke="#FFFFFF" stroke-width="0.3" stroke-opacity="0.08"/>
  <text x="800" y="892" text-anchor="middle" font-size="10.5" fill="#2E4057">
    © 2025–2026 Jawad Azeem · Blueprint — Telecom Billing Intelligence Platform
  </text>

</svg>
