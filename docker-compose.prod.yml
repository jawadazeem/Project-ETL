# docker-compose.prod.yml
#
# NOTE:
# This is NOT real production infrastructure.
# It is a production-like setup that runs entirely on a single server.
#
# AWS services are simulated using LocalStack to avoid cloud costs.
# In a real production environment, LocalStack would be replaced with:
# - AWS S3
# - AWS SQS
#
# This setup is used for cost-free deployment

services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_started
    networks:
      - default
      - proxy-net

  app:
    build: .
    container_name: billing-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      aws-cli-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/billingdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SERVER_ADDRESS=0.0.0.0
      - AWS_S3_ENDPOINT=http://localstack:4566
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
      - SPRING_AI_GOOGLE_GENAI_PROJECT_ID=${GOOGLE_PROJECT_ID}
      # The Fix: Disables automatic Spring Security lockdown for the tunnel
      - SPRING_AUTOCONFIGURE_EXCLUDE=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
    networks:
      - default
      - proxy-net

  postgres:
    image: postgres:16
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: billing_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "/home/jawadazeem/postgres_persistence:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_app -d billingdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localstack:
    image: localstack/localstack:3.0.0
    container_name: billing-s3-mock
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEFAULT_REGION=us-east-1
    volumes:
      - "/home/jawadazeem/localstack_persistence:/var/lib/localstack"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localstack:4566" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  aws-cli-setup:
    image: amazon/aws-cli
    container_name: infra-setup
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      echo 'Waiting for Localstack S3...';
      until aws --endpoint-url=http://localstack:4566 s3 ls > /dev/null 2>&1; do sleep 2; done;
      echo 'Waiting for SQS...';
      until aws --endpoint-url=http://localstack:4566 sqs list-queues > /dev/null 2>&1; do sleep 2; done;
      echo 'Configuring SQS...';
      aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name billing-event-queue;
      echo 'Configuring S3...';
      aws --endpoint-url=http://localstack:4566 s3 mb s3://cloud-billing;
      echo 'Linking S3 to SQS...';
      aws --endpoint-url=http://localstack:4566 s3api put-bucket-notification-configuration --bucket cloud-billing --notification-configuration '{"QueueConfigurations":[{"QueueArn":"arn:aws:sqs:us-east-::billing-event-queue","Events":["s:ObjectCreated:*"]}]}'
      echo 'Infrastructure configuration complete.'

  prediction-service:
    build: comp/prediction-service
    container_name: prediction-service
    restart: always
    networks:
      - default
      - proxy-net

  audit-service:
    build: comp/audit-service
    container_name: audit-service
    restart: always
    networks:
      - default
      - proxy-net

networks:
  proxy-net:
    external: true