include:
  - comp/multicloud-data-generator-service/docker-compose.yml
  
services:
  postgres:
    image: postgres:16
    container_name: billing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billingdb
      POSTGRES_USER: billing_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U billing_app -d billingdb" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgvector:
    image: pgvector/pgvector:pg17
    container_name: blueprint-org-context
    environment:
      - POSTGRES_DB=blueprint_org-context
      - POSTGRES_USER=blueprint
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    restart: unless-stopped

  # This represents the WHOLE AWS stack (S3, EventBridge, SQS, Lambda, etc.)
  localstack:
    image: localstack/localstack:3.0.0
    container_name: billing-s3-mock
    environment:
      - SERVICES=s3,sqs,events,lambda,iam
      - DEFAULT_REGION=us-east-1
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_DOCKER_NETWORK=blueprint_default
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build: .
    container_name: billing-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      aws-cli-setup:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/billingdb
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - AWS_S3_ENDPOINT=http://localstack:4566
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY=test
      - AWS_SECRET_KEY=test
      - BLUEPRINT_AI_PROVIDER=${BLUEPRINT_AI_PROVIDER:-google-genai}
      - SPRING_AI_GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
      - SPRING_AI_GOOGLE_GENAI_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - SPRING_AI_GOOGLE_GENAI_EMBEDDING_API_KEY=${GOOGLE_GENAI_API_KEY}
      - SPRING_AI_GOOGLE_GENAI_EMBEDDING_PROJECT_ID=${GOOGLE_PROJECT_ID}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Ephemeral: Only for setup in DEV environment
  aws-cli-setup:
    image: amazon/aws-cli
    container_name: infra-setup
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./comp/multicloud-ingestion-lambda:/workspace"
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      set -e;

      echo 'Waiting for Localstack S3...';
      until aws --endpoint-url=http://billing-s3-mock:4566 s3 ls > /dev/null 2>&1; do
        sleep 2;
      done;

      echo 'Waiting for Lambda...';
      until aws --endpoint-url=http://billing-s3-mock:4566 lambda list-functions > /dev/null 2>&1; do
        sleep 2;
      done;

      echo 'Waiting for SQS...';
      until aws --endpoint-url=http://billing-s3-mock:4566 sqs list-queues > /dev/null 2>&1; do
        sleep 2;
      done;
      
      echo 'Configuring SQS Queues...';
      aws --endpoint-url=http://billing-s3-mock:4566 sqs create-queue --queue-name billing-event-queue;
      aws --endpoint-url=http://billing-s3-mock:4566 sqs create-queue --queue-name knowledge-event-queue;
      
      echo 'Configuring S3 Buckets...';
      aws --endpoint-url=http://billing-s3-mock:4566 s3 mb s3://cloud-billing || true;
      aws --endpoint-url=http://billing-s3-mock:4566 s3 mb s3://trace-knowledge || true;
      
      echo 'Linking S3 to SQS...';
      # Link Billing
      aws --endpoint-url=http://billing-s3-mock:4566 s3api put-bucket-notification-configuration --bucket cloud-billing --notification-configuration '{\"QueueConfigurations\":[{\"QueueArn\":\"arn:aws:sqs:us-east-1:000000000000:billing-event-queue\",\"Events\":[\"s3:ObjectCreated:*\"]}]}';
      
      # Link Knowledge
      aws --endpoint-url=http://billing-s3-mock:4566 s3api put-bucket-notification-configuration --bucket trace-knowledge --notification-configuration '{\"QueueConfigurations\":[{\"QueueArn\":\"arn:aws:sqs:us-east-1:000000000000:knowledge-event-queue\",\"Events\":[\"s3:ObjectCreated:*\"]}]}';
      
      echo 'Configuring Lambda execution role...';
      printf '%s' '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"lambda.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}' > /tmp/lambda-trust-policy.json;
      aws --endpoint-url=http://billing-s3-mock:4566 iam create-role --role-name lambda-role --assume-role-policy-document file:///tmp/lambda-trust-policy.json > /dev/null 2>&1 || true;

      echo 'Packaging multicloud-ingestion-lambda...';
      cd /workspace;
      rm -f lambda_deploy.zip;
      python3 -m zipfile -c lambda_deploy.zip handler.py app;

      echo 'Deploying multicloud-ingestion-lambda to LocalStack...';
      if aws --endpoint-url=http://billing-s3-mock:4566 lambda get-function --function-name multicloud-ingestion-lambda > /dev/null 2>&1; then
        aws --endpoint-url=http://billing-s3-mock:4566 lambda update-function-code --function-name multicloud-ingestion-lambda --zip-file fileb://lambda_deploy.zip > /dev/null;
        aws --endpoint-url=http://billing-s3-mock:4566 lambda update-function-configuration --function-name multicloud-ingestion-lambda --handler handler.handler --runtime python3.10 --environment Variables='{BILLING_BUCKET=cloud-billing,AWS_ENDPOINT_URL=http://billing-s3-mock:4566}' > /dev/null;
      else
        aws --endpoint-url=http://billing-s3-mock:4566 lambda create-function --function-name multicloud-ingestion-lambda --runtime python3.10 --role arn:aws:iam::000000000000:role/lambda-role --handler handler.handler --zip-file fileb://lambda_deploy.zip --environment Variables='{BILLING_BUCKET=cloud-billing,AWS_ENDPOINT_URL=http://billing-s3-mock:4566}' > /dev/null;
      fi;

      echo 'Linking EventBridge to multicloud-ingestion-lambda...';
      aws --endpoint-url=http://billing-s3-mock:4566 events put-rule --name client-storage-poll-rule --event-pattern '{\"source\":[\"com.azeem.blueprint\"],\"detail-type\":[\"PollStorageTrigger\"]}' > /dev/null;

      aws --endpoint-url=http://billing-s3-mock:4566 lambda add-permission --function-name multicloud-ingestion-lambda --statement-id eventbridge-client-storage-poll --action lambda:InvokeFunction --principal events.amazonaws.com --source-arn arn:aws:events:us-east-1:000000000000:rule/client-storage-poll-rule > /dev/null 2>&1 || true;

      aws --endpoint-url=http://billing-s3-mock:4566 events put-targets --rule client-storage-poll-rule --targets Id=multicloud-ingestion,Arn=arn:aws:lambda:us-east-1:000000000000:function:multicloud-ingestion-lambda > /dev/null;

      echo 'Infrastructure configuration complete.'
      "

  docs:
    build: docs-site
    container_name: blueprint-docs
    restart: unless-stopped
    ports:
      - "3000:80"

  prediction-service:
    build: comp/prediction-service
    container_name: prediction-service
    restart: always

  audit-service:
    build: comp/audit-service
    container_name: audit-service
    restart: always

volumes:
  postgres_data:
  pgvector-data:
  ollama-data:
